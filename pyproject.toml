[project]
name = "conf-paper-code-baselines"
version = "0.1.0"
description = "CatBoost baselines for Uni-Mol molecular property benchmarks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "catboost>=1.2.5",
  "lmdb>=1.4.1",
  "numpy>=1.26,<3",
  "openbabel-wheel>=3.1.1.20",
  "rdkit>=2024.3.5",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "xgboost>=2.1.1",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.uv]
package = false
